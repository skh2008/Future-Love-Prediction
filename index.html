
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Love Predictor</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#090d19;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
min-height:100vh;
}

#camera{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
z-index:0;
background:#101729;
}

.shade{
position:fixed;
inset:0;
z-index:1;
pointer-events:none;
background:rgba(0,0,0,.25);
}

.overlay{
position:relative;
z-index:2;
min-height:100vh;
width:100%;
padding:35px 25px;
display:flex;
flex-direction:column;
align-items:center;
}

.heading{
text-align:center;
font-size:11px;
letter-spacing:4px;
color:#ffd1e2;
font-weight:bold;
text-shadow:0 2px 10px black;
}

h1{
font-size:30px;
margin:10px 0;
text-align:center;
text-shadow:0 2px 15px black;
}

#startScreen{
margin:auto 0;
text-align:center;
}

#startScreen p{
font-size:14px;
line-height:1.6;
max-width:280px;
text-shadow:0 2px 10px black;
}

button{
color:white;
cursor:pointer;
font-weight:bold;
}

.startBtn,#again{
border:1px solid #ffffffaa;
background:#ffffff18;
backdrop-filter:blur(5px);
border-radius:30px;
padding:13px 25px;
font-size:12px;
letter-spacing:1.5px;
}

#cameraError{
display:none;
font-size:12px;
color:#ffd0df;
margin-top:15px;
}

#timelineArea{
display:none;
width:min(100%,390px);
margin:auto 0;
position:relative;
padding:25px 0 25px 27px;
}

#timelineArea:before{
content:"";
position:absolute;
left:8px;
top:25px;
bottom:25px;
width:2px;
background:linear-gradient(
to bottom,
transparent,
#ff8db9 10%,
#c6a2ff 90%,
transparent
);
box-shadow:0 0 12px #f77eaf88;
}

.item{
position:relative;
min-height:76px;
padding:0 0 23px 18px;
opacity:.12;
transform:translateY(12px);
transition:opacity .5s,transform .5s;
}

.item.active,.item.done{
opacity:1;
transform:translateY(0);
}

.marker{
position:absolute;
left:-25px;
top:2px;
width:15px;
height:15px;
border:2px solid #ffc0d8;
border-radius:50%;
background:#24182e;
box-shadow:0 0 0 4px #ff8db933;
}

.item.active .marker{
background:white;
border-color:white;
box-shadow:0 0 0 5px #ff8db955,0 0 20px white;
animation:pulse 1s infinite;
}

.item.done .marker{
background:#c5a5ff;
border-color:#e0d1ff;
}

@keyframes pulse{
50%{transform:scale(1.2)}
}

.label{
font-size:10px;
letter-spacing:3px;
color:#ffd0e2;
margin-bottom:7px;
text-transform:uppercase;
text-shadow:0 2px 8px black;
}

.value{
font-size:clamp(19px,5vw,24px);
font-weight:bold;
line-height:1.3;
text-shadow:0 2px 12px black;
}

.item.active .value{
animation:reveal .65s ease both;
}

@keyframes reveal{
from{
opacity:0;
transform:translateY(14px);
filter:blur(5px);
}
to{
opacity:1;
transform:translateY(0);
filter:blur(0);
}
}

#finalLine{
display:none;
text-align:center;
font-size:14px;
margin-top:25px;
text-shadow:0 2px 12px black;
color:#ffd1e2;
}

#again{
display:none;
margin:22px auto 0;
}

@media(max-height:650px){
.overlay{padding-top:20px;padding-bottom:15px}
#timelineArea{padding-top:12px;padding-bottom:12px}
.item{min-height:62px;padding-bottom:13px}
#timelineArea:before{top:12px;bottom:12px}
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>
<div class="shade"></div>

<main class="overlay">

<div class="heading">A LITTLE BIT OF MAGIC</div>
<h1>Future Love ♡</h1>

<section id="startScreen">

<p>
Look into the camera and discover what your next relationship might look like.
</p>

<button class="startBtn" id="startBtn">
START PREDICTION ✨
</button>

<div id="cameraError"></div>

</section>

<section id="timelineArea">

<div class="item" data-key="Height">
<span class="marker"></span>
<div class="label">Height</div>
<div class="value"></div>
</div>

<div class="item" data-key="Hobby">
<span class="marker"></span>
<div class="label">Hobby</div>
<div class="value"></div>
</div>

<div class="item" data-key="Job">
<span class="marker"></span>
<div class="label">Job</div>
<div class="value"></div>
</div>

<div class="item" data-key="Gender">
<span class="marker"></span>
<div class="label">Gender</div>
<div class="value"></div>
</div>

<div class="item" data-key="Age">
<span class="marker"></span>
<div class="label">Age</div>
<div class="value"></div>
</div>

<div id="finalLine">
✨ A new chapter could be waiting for you…
</div>

<button id="again">↻ START AGAIN</button>

</section>
</main>

<script>
const video=document.getElementById('camera');
const startScreen=document.getElementById('startScreen');
const timeline=document.getElementById('timelineArea');
const errorBox=document.getElementById('cameraError');
const items=[...document.querySelectorAll('.item')];

let cameraStarted=false;
let runToken=0;


const choices={

Height:[
'4\'8" – 4\'10"',
'4\'11" – 5\'0"',
'5\'1" – 5\'2"',
'5\'3" – 5\'4"',
'5\'5" – 5\'6"',
'5\'7" – 5\'8"',
'5\'9" – 5\'10"',
'5\'11" – 6\'0"',
'6\'1" – 6\'2"',
'6\'3" – 6\'5"',
'6\'6" or taller'
],

Hobby:[
'Photography 📷',
'Travelling ✈️',
'Music & Singing 🎧',
'Reading Books 📚',
'Cooking 🍳',
'Painting 🎨',
'Gaming 🎮',
'Gardening 🌿',
'Swimming 🏊',
'Cycling 🚴',
'Football ⚽',
'Cricket 🏏',
'Fashion & Styling 👗',
'Writing ✍️',
'Dancing 💃',
'Fitness & Gym 🏋️',
'Watching Movies 🎬',
'Nature Exploration 🌳',
'Technology 💻',
'Collecting Things 🧸'
],

Job:[
'Doctor 🩺',
'Surgeon 🏥',
'Nurse 💉',
'Engineer ⚙️',
'Software Developer 💻',
'Teacher 📚',
'Professor 🎓',
'Scientist 🔬',
'Architect 🏛️',
'Lawyer ⚖️',
'Police Officer 👮',
'Military Officer 🎖️',
'Pilot ✈️',
'Air Host / Flight Attendant 🛫',
'Business Owner 🏢',
'Entrepreneur 🚀',
'Banker 🏦',
'Accountant 📊',
'Journalist 📰',
'Photographer 📷',
'Graphic Designer 🎨',
'Fashion Designer 👗',
'Actor 🎭',
'Singer 🎤',
'Musician 🎸',
'Chef 👨‍🍳',
'Writer ✍️',
'Artist 🖌️',
'Farmer 🌾',
'Electrician 🔌',
'Mechanic 🔧',
'Driver 🚘',
'Content Creator 📱',
'YouTuber 🎥',
'Influencer ⭐',
'Researcher 🧪',
'Pharmacist 💊',
'Veterinarian 🐾',
'Social Worker 🤝',
'Freelancer 🌐',
'Student 🎒',
'Government Employee 🏛️',
'Civil Servant 📋',
'Real Estate Agent 🏠',
'Fashion Model 📸',
'Fitness Trainer 💪',
'Chef & Baker 🥐',
'Unemployed / Exploring Life 🌱'
],

Gender:[
'Woman',
'Man',
'Non-binary',
'Genderqueer',
'Agender',
'Gender-fluid',
'Bigender',
'Other gender identity'
],

Age:[
'18–20 years',
'21–23 years',
'24–26 years',
'27–29 years',
'30–32 years',
'33–35 years',
'36–38 years',
'39–42 years',
'43–45 years',
'46–50 years',
'51–55 years',
'56–60 years',
'60+ years'
]

};


};

function pick(list){
return list[Math.floor(Math.random()*list.length)];
}

function wait(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

async function startCamera(){

if(cameraStarted)return true;

if(!navigator.mediaDevices?.getUserMedia){

errorBox.style.display='block';
errorBox.textContent='Camera requires HTTPS or localhost.';

return false;
}

try{

const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:'user'},
audio:false
});

video.srcObject=stream;
await video.play();

cameraStarted=true;
return true;

}catch(error){

errorBox.style.display='block';
errorBox.textContent='Please allow camera permission and try again.';

return false;
}

}

async function play(){

const token=++runToken;

document.getElementById('again').style.display='none';
document.getElementById('finalLine').style.display='none';

items.forEach(item=>{

item.classList.remove('active','done');
item.querySelector('.value').textContent='';

});

startScreen.style.display='none';
timeline.style.display='block';

for(let i=0;i<items.length;i++){

if(token!==runToken)return;

const item=items[i];

item.classList.add('active');

item.querySelector('.value').textContent=
pick(choices[item.dataset.key]);

// Wait 3 seconds before next prediction
await wait(3000);

if(token!==runToken)return;

item.classList.remove('active');
item.classList.add('done');

}

document.getElementById('finalLine').style.display='block';
document.getElementById('again').style.display='block';

}

document.getElementById('startBtn')
.addEventListener('click',async()=>{

if(await startCamera()){
play();
}

});

document.getElementById('again')
.addEventListener('click',()=>{

// Camera remains ON during restart.
play();

});

</script>
</body>
</html>
